base: rainbow_training.yaml

project:
  name: dynamic_patrol_default
  results_dir: results/default_training

xinjiekou_task_source:
  enabled: false
  mapping_source: direct_compressed_edge
  # ``null`` is intentional: the configuration loader deep-merges `{}` with
  # its smoke base, whereas null replaces that smoke-only mapping entirely.
  edge_overrides: null

xinjiekou_tasks:
  mapping_mode: direct_compressed_edge
  registry_path: data/xinjiekou/edge_task_registry.csv
  edge_selection:
    eligible_only: true
    exclude_self_loops: true
    exclude_zero_length: true
    fixed_seed: 2026
  routine_patrol:
    selection_mode: seeded_sample
    number_of_edges: 20
    selection_seed: 2026
    initial_release_time_s: 0.0
    interval_s: 600.0
    deadline_s: 3600.0
    priority: 2.0
    service_duration_s: 30.0
  dynamic_tasks:
    incident:
      rate_per_hour: 8.0
      deadline_s: 420.0
      priority: 10.0
      service_duration_s: 45.0
    congestion:
      rate_per_hour: 10.0
      deadline_s: 720.0
      priority: 6.0
      service_duration_s: 60.0

uav_path_planning:
  # Local visibility-graph expansion radius, calibrated independently on
  # Xinjiekou node pairs.  It is forwarded to plan_uav_path at commit time.
  search_buffer_m: 15.0

rl:
  timesteps: 100000
  run_name: rainbow_default
  model_name: rainbow_dqn_default.pt
  hyperparams:
    eval_interval: 10000
    checkpoint_interval: 10000

training:
  task_mapping_version: xinjiekou_direct_edge_default_v1
