# Isolate only multi-task sortie composition.  Observation/action dimensions
# remain the canonical joint-plan dimensions.
base: ../default_training.yaml

project:
  name: ablation_single_task

sortie:
  allow_multi_task: false
  max_tasks_per_sortie: 1

ablation:
  queue_aware_recovery: true
  skip_completed_run: true
