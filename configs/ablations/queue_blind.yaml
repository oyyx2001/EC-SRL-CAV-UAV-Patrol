# Hide current recovery-queue state from candidate generation, scores and all
# queue-specific policy features.  FIFO execution and hard safety validation
# remain enabled to keep the simulator physically valid.
base: ../default_training.yaml

project:
  name: ablation_queue_blind

ablation:
  queue_aware_recovery: false
  skip_completed_run: true

reward:
  stage5_weights:
    recovery_wait: 0.0
    recovery_queue: 0.0
