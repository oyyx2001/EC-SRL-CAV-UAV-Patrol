# No learned CAV wait/move/reroute action.  The simulator supplies a
# deterministic directed passive patrol whenever no FIFO recovery is pending.
base: ../default_training.yaml

project:
  name: ablation_fixed_cav

cav_control:
  action_set: [keep_route]
  passive_patrol:
    enabled: true

ablation:
  queue_aware_recovery: true
  skip_completed_run: true
