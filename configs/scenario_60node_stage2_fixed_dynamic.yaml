base: scenario_60node_stage2_rainbow_dynamic.yaml

simulation:
  terminate_on_all_terminal: false

reward:
  accounting_mode: interval_increment

time:
  mode: fixed_interval
  decision_interval_s: 60
  episode_horizon_s: 3600

event_driven:
  enabled: false

smdp:
  enabled: false
  reference_interval_s: 60
  gamma_reference: 0.99
  discount_mode: fixed_decision
  store_delta_t: true
  interval_normalize_reward: true
  n_step: 1

rl:
  training_epochs: 10000

training:
  seed_mode: random
  run_name: stage2_b1_fixed60_dynamic
  model_name: RainbowDQN_stage2_b1_fixed60_dynamic.pt
