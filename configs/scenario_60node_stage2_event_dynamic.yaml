base: scenario_60node_stage2_rainbow_dynamic.yaml

simulation:
  terminate_on_all_terminal: false

reward:
  accounting_mode: interval_increment

time:
  mode: event_driven
  decision_interval_s: 60
  episode_horizon_s: 3600

event_driven:
  enabled: true
  process_same_time_events_together: true
  skip_forced_wait_decisions: true
  decision_on_task_release: true
  decision_on_cav_node_arrival: true
  decision_on_uav_available: true
  decision_on_task_completion: true
  allow_instantaneous_multi_dispatch: true
  max_instantaneous_decisions: auto
  stale_event_check: true
  event_time_tolerance: 1.0e-9

smdp:
  enabled: true
  reference_interval_s: 60
  gamma_reference: 0.99
  discount_mode: continuous_time
  store_delta_t: true
  allow_zero_duration_dispatch: true
  interval_normalize_reward: true
  n_step: 1

rl:
  training_epochs: 10000

training:
  seed_mode: random
  run_name: stage2_b2_event_smdp_dynamic
  model_name: RainbowDQN_stage2_b2_event_smdp_dynamic.pt
