# Default workload and three-dimensional voxel planning for Xinjiekou.
# Expected routine release attempts per 3-hour episode: one dynamically
# selected eligible physical edge every 300 s (at most 36 attempts), plus
# approximately 6 incident, 6 congestion, 3 obstruction and one critical
# window task = about 88 in total (the Poisson counts vary by episode seed).
base: task_generation.yaml

project:
  name: dynamic_patrol_default
  results_dir: results/default_training

uav_path_planning:
  enabled: true
  planner_type: voxel_astar_3d
  region: xinjiekou
  voxel_map_dir: truck_uav_modules/data/xinjiekou/voxel_map_3d
  voxel_size_m: 10.0
  voxel_size_z_m: 20.0
  min_operational_altitude_m: 20.0
  max_operational_altitude_m: 120.0
  launch_altitude_m: 20.0
  recovery_altitude_m: 20.0
  default_task_observation_altitude_m: 20.0
  neighbor_mode: 26
  prevent_corner_cutting: true
  heuristic: euclidean
  use_path_cache: true
  fallback_to_2d_planner: false
  fallback_to_next_candidate: false
  planning_budget:
    # Temporarily disable the wall-time/expanded-node guard for diagnosis;
    # two-dimensional fallback remains disabled.
    enabled: false
    max_segment_planning_time_ms: 200.0
    max_sortie_planning_time_ms: 800.0
    max_expanded_nodes_per_segment: 100000
    check_interval_expansions: 128
  road_clearance:
    enabled: true
    road_buffer_m: 10.0
    force_free_above_road: true
    min_clearance_altitude_m: 20.0
    max_clearance_altitude_m: 120.0
  point_projection:
    prefer_road_clearance_voxels: true
    max_horizontal_projection_m: 20.0
    max_vertical_projection_m: 40.0

xinjiekou_tasks:
  mapping_mode: direct_compressed_edge
  registry_path: data/xinjiekou/edge_task_registry.csv
  edge_selection:
    eligible_only: true
    exclude_self_loops: true
    exclude_zero_length: true
    fixed_seed: 2026
  routine_patrol:
    release_mode: periodic_dynamic
    selection_mode: least_recently_inspected
    selection_scope: all_eligible_segments
    tasks_per_release: 1
    prevent_active_duplicate: true
    min_revisit_interval_s: 900.0
    no_eligible_segment_policy: skip
    random_tie_break: true
    seed_mode: episode_seed
    base_seed: 2026
    initial_release_time_s: 0.0
    interval_s: 300.0
    deadline_s: 3600.0
    priority: 2.0
    service_duration_s: 30.0
  dynamic_tasks:
    incident:
      rate_per_hour: 2.0
      deadline_s: 420.0
      priority: 10.0
      service_duration_s: 45.0
    congestion:
      rate_per_hour: 2.0
      # Fourteen additional light-pilot congestion inspections bring the
      # seed-7 three-hour workload from 46 to 60 tasks; routine patrol remains
      # exactly one dynamically selected segment per 300 s release slot.
      additional_release_times_s: [150.0, 750.0, 1350.0, 1950.0, 2550.0, 3150.0, 3750.0, 4350.0, 4950.0, 5550.0, 6150.0, 6750.0, 7350.0, 7950.0]
      deadline_s: 720.0
      priority: 4.0
      service_duration_s: 60.0
    # Obstruction arrivals use a modest stochastic rate in the default workload.
    road_obstruction_inspection:
      release_mode: poisson
      rate_per_hour: 1.0
      deadline_s: 300.0
      priority: 8.0
      service_duration_s: 35.0
    # The existing Xinjiekou task model defines this category as a known
    # critical window at 900 s, so retain that explicit scheduled release.
    critical_period_patrol:
      release_mode: fixed_times
      release_times_s: [900.0]
      deadline_s: 360.0
      priority: 6.0
      service_duration_s: 40.0

rl:
  run_name: rainbow_default
  model_name: rainbow_dqn_default.pt

training:
  task_mapping_version: xinjiekou_direct_edge_default_v1
