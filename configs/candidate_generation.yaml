# Default bounded candidate-generation configuration. The implementation remains
# backwards compatible: setting optimization_enabled to false selects the
# original exhaustive generator for fixed-state comparisons.
base: voxel_planning.yaml

project:
  name: dynamic_patrol_default
  results_dir: results/default_training

candidate_generation:
  optimization_enabled: true
  max_prefiltered_tasks_per_uav: 6
  max_recovery_nodes_per_sequence: 3
  max_full_evaluations_per_uav: 100
  final_top_k_per_uav: 12

  enable_task_prefilter: true
  enable_incremental_pruning: true
  enable_connectivity_filter: true
  enable_recovery_prefilter: true
  enable_distance_cache: true
  enable_cav_eta_cache: true
  enable_bounded_top_k: true
  enable_candidate_deduplication: true
  enable_joint_plan_deduplication: true

  preserve_high_priority_tasks: true
  high_priority_threshold: 8.0
  preserve_urgent_tasks: true
  urgent_deadline_threshold_s: 300.0

  # Set these only after a matching node-to-voxel mapping and component label
  # artifact has been produced.  Their absence deliberately means "unknown",
  # never "disconnected".
  connectivity_labels_file: null
  connectivity_node_voxels_file: null
