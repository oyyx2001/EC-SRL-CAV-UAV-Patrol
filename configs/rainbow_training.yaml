base: xinjiekou_path_planning.yaml

project:
  name: dynamic_patrol_default
  results_dir: results/default_training

simulation:
  task_release_horizon_s: 10800
  drain_phase_enabled: true
  max_drain_time_s: 600

decision_mode: joint_plan

cav_control:
  mode: joint_plan
  action_set: [keep_route, wait, move_to, reroute]
  max_ground_candidates: 8

joint_plan:
  max_non_safe_plans: 24
  max_ground_candidates: 4
  max_sorties_per_ground: 6
  max_insertions_per_pair: 1
  type_quotas: {type_I: 12, type_II: 8, type_III: 4}

uav_return_guard:
  enabled: true
  max_return_distance_increase_ratio: 0.75
  return_distance_floor_m: 100
  enforce_energy_feasibility: true
  minimum_battery_slack: 0

xinjiekou_task_source:
  enabled: false
  mapping_source: direct_compressed_edge
  task_model_file: null
  edge_file: truck_uav_modules/data/xinjiekou/road_edges.geojson
  edge_overrides:
    xjk_insp_000172: compressed_edge_000000
    xjk_insp_000238: compressed_edge_000001
    xjk_insp_000313: compressed_edge_000002
    xjk_insp_000507: compressed_edge_000003
    xjk_insp_000550: compressed_edge_000004
  require_complete_mapping: true

# Base mapping mode; the formal registry and generation settings are supplied
# by task_generation.yaml later in the default configuration chain.
xinjiekou_tasks:
  mapping_mode: direct_compressed_edge

reward:
  mode: stage5_coordinated
  accounting_mode: interval_increment
  normalization: {enabled: false, scale_version: xinjiekou-default-unscaled-v1}
  stage5_references: {time_s: 60.0, return_distance_m: 1000.0, cav_distance_m: 1000.0}
  stage5_weights:
    complete: 30.0
    priority: 2.0
    timeout: 30.0
    aoi: 0.00001
    flight_energy: 0.000002
    hover_energy: 0.000002
    return_distance: 0.20
    cav_distance: 0.08
    recovery_wait: 0.08
    recovery_queue: 0.06
    route_change: 0.05
    route_reverse: 0.15
    coordination_failure: 15.0

rl:
  algo: rainbow_dqn
  timesteps: 10000
  run_name: rainbow_default
  model_name: rainbow_dqn_default.pt
  action_masking: true
  eval_seeds: [1000, 1001, 1002, 1003, 1004, 1005, 1006, 1007, 1008, 1009, 1010, 1011, 1012, 1013, 1014, 1015, 1016, 1017, 1018, 1019]
  train_scenario: xinjiekou_default
  eval_scenario: xinjiekou_default_eval
  hyperparams:
    candidate_dim: 38
    batch_size: 128
    replay_buffer_size: 100000
    learning_starts: 1000
    target_update_interval: 2000
    eval_interval: 2000
    checkpoint_interval: 2000
    diagnostic_sample_stride: 1

training:
  seed_mode: fixed
  task_mapping_version: xinjiekou_direct_edge_default_v1
  path_planner_version: voxel_astar_3d_default_v1
  map_version: xinjiekou_voxel_map_3d_v1
